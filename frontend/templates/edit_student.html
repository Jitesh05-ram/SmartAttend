{% extends "base.html" %}

{% block title %}Edit Student | SmartAttend{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="auth-card">

        <h2 class="mb-4">
            <i class="fa-solid fa-pen"></i>
            Edit Student
        </h2>

        <form method="POST" action="{{ url_for('students.edit_student_page', student_id=student.id) }}">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


            <div class="mb-3">
                <label class="form-label">Roll Number</label>
                <input type="text" name="roll_number" class="form-control" value="{{ student.roll_number }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Batch</label>
                <input type="text" name="batch" class="form-control" value="{{ student.batch or '' }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Batch Group</label>
                <select name="batch_id" class="form-select">
                    <option value="">-- No batch --</option>
                    {% for batch in batches %}
                        <option value="{{ batch.id }}" {% if student.batch_id == batch.id %}selected{% endif %}>{{ batch.name }}</option>
                    {% endfor %}
                </select>
                {% if not batches %}
                <div class="form-text">
                    You haven't added any batches yet.
                    <a href="{{ url_for('batches.add_batch', next=url_for('students.edit_student_page', student_id=student.id)) }}">Add one</a>.
                </div>
                {% endif %}
            </div>

            <div class="mb-3">
                <label class="form-label">Academic Year</label>
                <input type="number" name="academic_year" class="form-control"
                       value="{{ student.academic_year or '' }}" placeholder="e.g. 2026" min="1900" max="2200">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" value="{{ student.email or '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" name="phone" class="form-control" value="{{ student.phone or '' }}">
            </div>

            <div class="d-flex flex-column flex-sm-row gap-2 mt-2">


                <button type="submit" class="btn btn-primary flex-fill">
                <i class="fa-solid fa-save"></i>
                Save Changes
            </button>


                <a href="{{ url_for('students.student_list') }}" class="btn btn-outline-secondary flex-fill">
                Cancel
            </a>


            </div>

        </form>

    </div>

</div>

{% endblock %}
