{% extends "base.html" %}

{% block title %}Edit Student | SmartAttend{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="auth-card">

        <h2 class="mb-4">
            <i class="fa-solid fa-pen"></i>
            Edit Student
        </h2>

        <form method="POST" action="{{ url_for('students.edit_student_page', student_id=student.id) }}">

            <div class="mb-3">
                <label class="form-label">Roll Number</label>
                <input type="text" name="roll_number" class="form-control" value="{{ student.roll_number }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" value="{{ student.name }}" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Batch</label>
                <input type="text" name="batch" class="form-control" value="{{ student.batch or '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Year</label>
                <input type="text" name="year" class="form-control" value="{{ student.year or '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" value="{{ student.email or '' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" name="phone" class="form-control" value="{{ student.phone or '' }}">
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-save"></i>
                Save Changes
            </button>

            <a href="{{ url_for('students.student_list') }}" class="btn btn-secondary">
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
