{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block content %}

<div class="auth-container">

<div class="auth-card">

<h2 class="auth-title">

Reset Password

</h2>

<form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">

{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
{% endwith %}

<div class="mb-3">

<label>New Password</label>

<input
type="password"
name="password"
class="form-control"
minlength="8"
required>

</div>

<div class="mb-3">

<label>Confirm Password</label>

<input
type="password"
name="confirm_password"
class="form-control"
minlength="8"
required>

</div>

<button
type="submit"
class="btn btn-success btn-auth">

Reset Password

</button>

</form>

</div>

</div>

{% endblock %}
